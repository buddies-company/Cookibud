name: Organization-Wide Deploy
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, nixos-server] 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Fix Permissions
        run: |
          # Ensure the Docker user can read the frontend files
          sudo chown -R 1000:1000 cookibud-front 
          chmod -R 755 cookibud-front/public

      - name: Deploy
        run: |          
          echo "${{ secrets.FRONT_ENV_FILE }}" > cookibud-front/.env
          echo "${{ secrets.API_ENV_FILE }}" > cookibud-api/.env

          mkdir -p cookibud-api/static/uploads

          # Create .npmrc file for private GitHub packages
          # We use printf to avoid trailing newline issues with tokens
          printf "@soilhat:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n" "${{ secrets.GITHUB_TOKEN }}" > cookibud-front/.npmrc

          docker-compose up -d --build
          docker image prune -f