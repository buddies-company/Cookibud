name: Organization-Wide Deploy
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, nixos-server] 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: 'current_app' 

      - name: Deploy
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          git pull origin main
          
          docker-compose up -d --build
          docker image prune -f