name: Organization-Wide Deploy
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, nixos-server] 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: 'current_app' 

      - name: Deploy
        run: |
          # Create directory if it doesn't exist
          mkdir -p ${{ vars.DEPLOY_PATH }}
          cd ${{ vars.DEPLOY_PATH }}
          
          # Initialize git if empty, otherwise pull
          if [ ! -d ".git" ]; then
            git clone git@github.com:${{ github.repository }}.git .
          else
            git pull origin main
          fi
          
          echo "${{ secrets.FRONT_ENV_FILE }}" > cookibud-front/.env
          echo "${{ secrets.API_ENV_FILE }}" > cookibud-api/.env

          mkdir -p cookibud-api/static/uploads

          # Create .npmrc file for private GitHub packages
          # We use printf to avoid trailing newline issues with tokens
          printf "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}\n" > cookibud-front/.npmrc
          
          docker-compose up -d --build
          docker image prune -f